[package]
name = "todoapp"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.32.1"
popout = "0.1.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
chrono = { version = "0.4", features = ["serde"] }

[package.metadata.winres]
# Marks it as a "GUI app"
windows_subsystem = "windows"